[package]
name = "tauri-plugin-haptics"
version = "0.1.0"
description = "Tauri 2 haptics plugin: raw-pattern vibration via Android Vibrator (no-op on desktop)."
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-haptics"
license = "MIT"

[lib]
name = "tauri_plugin_haptics"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", default-features = false, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.0.2", features = ["build"] }
