[package]
name = "winplayer"
version = "1.8.3"
description = "A plugin-driven music player with WinUI design, built with Tauri 2"
authors = ["WinPlayer Contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "winplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# 读取 Android 选择器返回的 content:// URI（对话框插件依赖它做作用域，这里直接用其文件 API）
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 安卓媒体控件（媒体通知/锁屏/线控）：vendored 修复版，桌面端为 no-op
tauri-plugin-media-session = { path = "../tauri-plugin-media-session" }
# 安卓 APK 安装（自动更新用）：调起系统软件包安装器，桌面端为 no-op
tauri-plugin-apk-installer = { path = "../tauri-plugin-apk-installer" }
# 安卓触感反馈（震动）：WebView 不提供 navigator.vibrate，走原生 Vibrator，桌面端为 no-op
tauri-plugin-haptics = { path = "../tauri-plugin-haptics" }
# 使用 rustls（纯 Rust TLS），避免依赖系统 OpenSSL，便于 Android/Linux 交叉编译与打包
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
# zip 2.x/3.x 已被上游全部 yank（安全事件），仅 9.x 可用
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
rand = "0.9"
# 图片缓存：解码并压缩（最长边 512、JPEG）后落盘
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# 原生音频播放：symphonia 解码（无 opus，symphonia 0.5 暂不支持）、rodio 输出（Windows WASAPI / Android AAudio）
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "pcm", "vorbis", "ogg"] }
rodio = { version = "0.20", default-features = false }
rtrb = "0.3"

# 仅 Windows 平台生效的原生依赖（SMTC / 系统托盘 / 窗口材质）
[target.'cfg(windows)'.dependencies]
# 系统托盘：在 windows 目标上给 tauri 追加 tray-icon feature，
# 放在 target 段使 Android 构建完全不引入 tray-icon / muda。
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
windows = { version = "0.62", features = [
  "Foundation",
  "Media",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }
# 桌面窗口材质（Mica / Acrylic）：调 DWM 系统背板 / 合成属性
window-vibrancy = "0.6"

# 以下特性只在测试（SMTC 冒烟测试）里用到
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Media_Control", "Win32_UI_WindowsAndMessaging"] }
windows-collections = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
