[package]
name = "tauri-plugin-mic-permission"
version = "0.1.0"
description = "Tauri 2 microphone permission plugin: runtime RECORD_AUDIO request on Android (no-op on desktop)."
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-mic-permission"
license = "MIT"

[lib]
name = "tauri_plugin_mic_permission"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", default-features = false, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.0.2", features = ["build"] }
